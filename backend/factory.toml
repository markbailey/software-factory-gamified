# Software Factory backend configuration (slice 5: gates and control)

[server]
host = "127.0.0.1"
port = 8765

[workspace]
# Everything the machines touch lives under this folder (relative to this file).
path = "../workspace"
# The default repo: the throwaway test project, a clone of `remote`, created on first start
# if missing. Each pipeline can work on its own repo instead: set it in the game (build mode,
# the pipeline's intake, Settings). Those are cloned into <workspace>/repos/<owner>/<name>
# unless you give a folder that's already a clone.
repo = "test-project"
remote = "https://github.com/markbailey/test-project.git"
# Each crate gets its own git worktree and branch here, so crates never clash.
worktrees = "worktrees"
base_branch = "main"

[security]
# Executables a machine may launch. Version suffixes and .exe/.cmd are ignored.
# Anything else is refused and the crate is scrapped.
allowed_commands = ["python", "git", "gh", "claude"]

[belts]
travel_seconds = 1.5

[cleanup]
# The janitor removes worktrees and local branches of shipped crates, of crates scrapped
# more than keep_scrapped_hours ago, and of crates the factory no longer knows about.
interval_minutes = 10
keep_scrapped_hours = 24

[health]
# Checks that Claude is available by asking it for a one-word reply (with the small, cheap
# model). While a check fails, machines that run Claude hold their crates and the game shows
# a banner; everything resumes by itself when a check passes. A Claude step that fails also
# triggers a check, and if Claude is down the step runs again once it's back.
enabled = true
interval_seconds = 300   # between checks while Claude is fine
retry_seconds = 30       # between checks while it isn't
timeout_seconds = 90
# command = ["claude", "-p", "Reply with the single word OK.", "--model", "haiku"]

# ---------------------------------------------------------------------------
# Intake: where work comes from besides typing a spec in the game.
# ---------------------------------------------------------------------------
[intake.github]
# Open issues with this label become crates. Each pipeline that takes GitHub issues watches
# its own repo; `repo` here is the default repo's (it's read from `remote` if left out). The PR says "Closes #n", and the
# factory comments on the issue when the PR opens or the crate is scrapped.
enabled = true
repo = "markbailey/test-project"
label = "factory"
poll_seconds = 60

[intake.jira]
# Jira Cloud. Put an API token in the JIRA_API_TOKEN environment variable
# (https://id.atlassian.com/manage-profile/security/api-tokens).
enabled = false
base_url = "https://your-site.atlassian.net"
email = "you@example.com"
token_env = "JIRA_API_TOKEN"
jql = "labels = factory AND statusCategory != Done"
poll_seconds = 60

[intake.review_requests]
# Open, non-draft pull requests where you are a requested reviewer (in any repo) go to the
# review line: wait for green CI, Claude drafts a review, you approve it, it is posted as you.
# New commits bring a PR back for a fresh review.
enabled = true
reviewer = "@me"   # whoever `gh auth status` says you are signed in as
query = ""         # extra GitHub search terms, e.g. "org:my-company -repo:owner/noisy"
poll_seconds = 120

# The machines and the line live in machines.toml (catalogue) and line.json (your line).
